<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Refbox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed sidebar (flat folder list) + top bar + scrolling work area; dark-only by design */
:root{
  color-scheme: dark;
  --bg:#111114; --side:#16161a; --surf:#1c1c21; --surf2:#25252c; --line:#2e2e37;
  --ink:#f2f2f5; --mute:#a0a0ac; --faint:#6c6c78;
  --acc:#8f90fa; --acc-ink:#14142b;
  --t-header:#38bdf8; --t-logo:#f5a524; --t-button:#22c55e; --t-typography:#f472b6; --t-footer:#2dd4bf; --logo-bg:#000000; --panel-w:264px;
  --warn:#f59e0b; --bad:#f87171; --scrim:rgba(6,6,10,.72);
  --f-ui:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-brand:"Unbounded", "Onest", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
/* Light theme: baby pink ground; dark theme above is unchanged */
body[data-ui="light"]{
  color-scheme: light;
  --bg:#FDF2F4; --side:#FBE7EA; --surf:#FFFFFF; --surf2:#FCE9EC; --line:#F2CDD3;
  --ink:#2B1A1F; --mute:#6B4A53; --faint:#8F6F78;
  --acc:#D4386C; --acc-ink:#FFFFFF; --logo-bg:#B84A6C;
  --t-header:#0284C7; --t-logo:#B45309; --t-button:#15803D; --t-typography:#8B3FD9; --t-footer:#0F766E;
  --warn:#B45309; --bad:#C2262F; --scrim:rgba(60,20,30,.45);
}
body[data-ui="light"] .box .tab{color:#fff}
body[data-ui="light"] .btn:not(.primary):not(.danger):hover{border-color:var(--acc); color:var(--acc)}
body[data-ui="light"] .btn.primary:hover{filter:none; background:#B82D5B}
body[data-ui="light"] .nav[aria-current="true"]{background:#FADBE1}
*{box-sizing:border-box}
.tagrow{position:relative}
.tagrow .del{position:absolute; right:6px; top:50%; transform:translateY(-50%); width:24px; height:24px; border-radius:6px; border:0; background:var(--surf); color:var(--mute); padding:0; font-size:15px; line-height:1; opacity:0}
.tagrow:hover .del,.tagrow .del:focus-visible{opacity:1}
.tagrow:hover .n{visibility:hidden}
.tagrow .del:hover{color:var(--bad); background:var(--line)}
@media (hover:none){.tagrow .del{opacity:1; position:static; transform:none}}
.status{margin-top:auto; display:flex; flex-direction:column; gap:4px; padding:10px; border-radius:8px; background:var(--surf); border:1px solid var(--line); font-size:12px; color:var(--mute)}
.status .ok{color:var(--t-button)} .status .bad{color:var(--bad)}
.status + .keys{margin-top:0}
.ghead{display:flex; align-items:center; justify-content:space-between; padding-right:6px}
.plus{width:22px; height:22px; border-radius:6px; border:1px solid var(--line); background:var(--surf2); color:var(--ink); display:grid; place-items:center; padding:0; font:500 15px/1 var(--f-ui)}
.plus:hover,.plus[aria-expanded="true"]{border-color:var(--acc); color:var(--acc)}
.newtag{display:flex; gap:6px; padding:0 6px 8px}
.newtag input{flex:1; min-width:0; height:30px; border-radius:7px; border:1px solid var(--line); background:var(--bg); padding:0 8px; font-size:13px}
.newtag .btn{height:30px; padding:0 10px}
.up{position:absolute; top:8px; right:8px; width:28px; height:28px; border-radius:50%; border:1px solid rgba(255,255,255,.18); background:rgba(10,10,14,.78); color:#f2f2f5; display:grid; place-items:center; padding:0; font-size:13px; opacity:0; transition:opacity .12s}
.card:hover .up,.up:focus-visible{opacity:1}
@media (hover:none){.up{opacity:1}}
.linkform{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
.linkform input{height:34px; border-radius:8px; border:1px solid var(--line); background:var(--surf); padding:0 12px; flex:1 1 220px; min-width:0}
.links{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; max-width:760px}
.links li{display:flex; align-items:center; gap:12px; background:var(--surf); border:1px solid var(--line); border-radius:10px; padding:10px 12px}
.links a{flex:1; min-width:0; display:flex; flex-direction:column; color:var(--ink); text-decoration:none}
.links a:hover .ln{color:var(--acc)}
.links .ln{font-weight:500}
.links .lu,.links .lf{font:400 12px var(--f-mono); color:var(--mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.links .x{border:0; background:none; color:var(--faint); font-size:16px}
.links .x:hover{color:var(--bad)}
.lgroup{margin-top:20px; max-width:760px}
.linkform select{height:34px; border-radius:8px; border:1px solid var(--line); background:var(--surf); padding:0 10px; width:auto}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font:400 14px/1.45 var(--f-ui); margin:0}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc); outline-offset:2px}
.app{display:grid; grid-template-columns:248px minmax(0,1fr); height:100%}

/* Sidebar */
.side{background:var(--side); border-right:1px solid var(--line); overflow:auto; display:flex; flex-direction:column; gap:22px;
  padding-block:18px; padding-left:max(14px, env(safe-area-inset-left,0px)); padding-right:14px}
.brand{display:flex; align-items:center; gap:10px; padding:0 8px; font:500 16px var(--f-brand); letter-spacing:.01em}

.nav .n{font:400 12px var(--f-mono); color:var(--mute); font-variant-numeric:tabular-nums}
.nav .ico{width:16px; text-align:center; color:var(--mute)}
.dot{width:9px; height:9px; border-radius:50%; flex:none; margin:0 3px}
.nav.attn .ico,.nav.attn .n{color:var(--warn)}
.keys{margin-top:auto; color:var(--faint); font-size:12px; padding:0 10px; display:grid; grid-template-columns:auto 1fr; gap:4px 10px}
kbd{font:500 11px var(--f-mono); background:var(--surf2); border:1px solid var(--line); border-radius:4px; padding:0 5px; color:var(--mute); justify-self:start}

/* Main */
.main{display:flex; flex-direction:column; min-width:0; overflow:hidden}
.top{display:flex; align-items:center; gap:10px; flex-wrap:wrap; border-bottom:1px solid var(--line);
  padding-block:12px; padding-left:20px; padding-right:max(16px, env(safe-area-inset-right,0px))}
.ib{width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--surf); display:grid; place-items:center}
.ib:disabled{opacity:.35; cursor:default}
.crumbs{display:flex; align-items:center; gap:6px; min-width:0; flex:1; color:var(--mute); overflow:hidden; white-space:nowrap}
.crumbs button{border:0; background:none; color:var(--mute); padding:2px 4px; border-radius:6px}
.crumbs button:hover{color:var(--ink); background:var(--surf2)}
.crumbs .cur{color:var(--ink); overflow:hidden; text-overflow:ellipsis}
.search{height:34px; width:min(260px,100%); border-radius:8px; border:1px solid var(--line); background:var(--surf); padding:0 12px}
.search::placeholder{color:var(--faint)}
.btn{height:34px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 14px; border-radius:8px; border:1px solid var(--line); background:var(--surf2); font-weight:500; font-size:13.5px; white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--acc); color:var(--acc-ink); border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.wide{width:100%; height:40px}
.pill{display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:var(--surf); font-size:12.5px; color:var(--mute)}
.pill .led{width:7px; height:7px; border-radius:50%; background:var(--t-button)}
.pill[aria-pressed="false"] .led{background:var(--faint)}
.view{flex:1; overflow:auto; padding-block:24px 40px; padding-left:24px; padding-right:max(24px, env(safe-area-inset-right,0px))}

/* Grid */
.head{display:flex; align-items:baseline; gap:12px; margin:0 0 18px; flex-wrap:wrap}
.head h1{font:500 20px var(--f-brand); margin:0; text-wrap:balance}
.head .count{font:400 13px var(--f-mono); color:var(--mute)}
.head p{margin:0; color:var(--mute); flex-basis:100%}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px}
.card{background:var(--surf); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; transition:border-color .15s}
.card:hover{border-color:var(--acc)}
.thumb{position:relative; display:block; width:100%; padding:0; border:0; background:var(--surf2); aspect-ratio:4/3}
.thumb img{width:100%; height:100%; object-fit:cover; display:block}
.badge{position:absolute; top:8px; right:8px; background:rgba(10,10,14,.78); color:#f2f2f5; font:500 11.5px var(--f-mono); padding:3px 8px; border-radius:999px; display:inline-flex; align-items:center; gap:6px}
.badge.proc{left:8px; right:auto}
.badge.fail{left:8px; right:auto; color:var(--bad)}
.spin{width:10px; height:10px; border-radius:50%; border:2px solid rgba(255,255,255,.25); border-top-color:#fff; animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.meta{padding:10px 12px 12px; display:flex; flex-direction:column; gap:6px; min-width:0}
.meta .t{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.meta .s{font:400 11.5px var(--f-mono); color:var(--mute)}
.mini-tags{display:flex; gap:4px; flex-wrap:wrap}
.mini-tags span{font-size:11.5px; color:var(--mute); background:var(--surf2); border-radius:999px; padding:1px 8px}
.ecard .thumb{background-color:var(--surf2); background-image:linear-gradient(45deg,var(--surf) 25%,transparent 25%,transparent 75%,var(--surf) 75%),linear-gradient(45deg,var(--surf) 25%,transparent 25%,transparent 75%,var(--surf) 75%); background-size:16px 16px; background-position:0 0,8px 8px; border-top:3px solid var(--tc)}
.ecard .thumb img{object-fit:contain; padding:14px}
.row{display:flex; align-items:center; justify-content:space-between; gap:8px}
.link{border:0; background:none; color:var(--acc); padding:2px 0; font-weight:500; font-size:12.5px; white-space:nowrap}
.link:hover{text-decoration:underline}
.empty{border:1px dashed var(--line); border-radius:12px; padding:40px 24px; text-align:center; color:var(--mute); display:flex; flex-direction:column; gap:12px; align-items:center}
.empty b{color:var(--ink); font-weight:500}

/* Detail */
.detail{display:grid; grid-template-columns:minmax(0,1fr) var(--panel-w); gap:24px; align-items:start}
.ess{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:0}
.ess dt{font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--faint)}
.ess dd{margin:2px 0 0; font-size:13.5px; font-weight:500; overflow-wrap:anywhere}
.ess a{color:var(--ink); text-decoration:none; border-bottom:1px solid var(--line)}
.ess a:hover{border-color:var(--acc)}
.more{border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin:0 -16px; padding:0 16px}
.more summary{cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; padding:10px 0; font-size:13px; color:var(--mute)}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"▾"; color:var(--faint)}
.more[open] summary::after{content:"▴"}
.more summary span{margin-left:auto; margin-right:8px; font:400 12px var(--f-mono); color:var(--faint)}
.more-in{display:flex; flex-direction:column; gap:18px; padding:4px 0 16px}
.likes{display:flex; flex-direction:column; gap:10px}
.likes h2{font:500 11px var(--f-ui); text-transform:uppercase; letter-spacing:.09em; color:var(--faint); margin:0}
.lchips{display:flex; flex-wrap:wrap; gap:6px}
.lchip{border:1px solid var(--line); background:var(--surf2); border-radius:999px; padding:3px 10px; font-size:12.5px; color:var(--mute)}
.lchip[aria-pressed="true"]{background:color-mix(in srgb, var(--acc) 22%, transparent); border-color:var(--acc); color:var(--ink)}
.notes{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.notes li{background:var(--surf2); border-radius:8px; padding:8px 10px; display:flex; flex-direction:column; gap:4px; font-size:13px}
.notes .nt{display:flex; flex-direction:column; gap:2px; overflow-wrap:anywhere}
.notes b{font-weight:500; font-size:12px; color:var(--acc)}
.notes .nm{display:flex; justify-content:space-between; align-items:center; font:400 11px var(--f-mono); color:var(--faint)}
.notes .x{border:0; background:none; color:var(--faint); padding:0 2px}
.notes .x:hover{color:var(--bad)}
.noteform{display:flex; flex-direction:column; gap:8px}
.noteform textarea{resize:vertical; min-height:56px; max-height:160px; border-radius:8px; border:1px solid var(--line); background:var(--bg); padding:8px 10px; font:inherit; font-size:13px}
.noteform .row .btn{flex:1}
.mic.rec{background:var(--bad); border-color:var(--bad); animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.col{display:flex; flex-direction:column; gap:16px; min-width:0}
.stage{position:relative; border-radius:10px; overflow:auto; max-height:calc(100dvh - 220px); overscroll-behavior:contain; border:1px solid var(--line); background:#000; line-height:0}
.canvas{position:relative; max-width:none}
.canvas img{width:100%; display:block}
.thumb img{object-position:top}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.seg button{border:0; background:var(--surf); padding:0 12px; height:32px; font-size:13px; color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--surf2); color:var(--ink)}
.box{position:absolute; border:2px solid var(--tc); background:color-mix(in srgb, var(--tc) 9%, transparent); padding:0; border-radius:3px; transition:opacity .15s, background .15s; line-height:1}
.box:hover{background:color-mix(in srgb, var(--tc) 22%, transparent)}
.box .tab{position:absolute; left:-2px; top:-2px; background:var(--tc); color:#0d0d10; font:600 11px var(--f-ui); padding:2px 6px; border-radius:3px 0 3px 0; white-space:nowrap}
.stage .box{transition:opacity .12s}
.stage.hl .box:not(.on){opacity:.3}
.stage.hl .box.on{border-width:3px; box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
.stage.off .box:not(.on){opacity:0; pointer-events:none}
.stage.off.peek .box{opacity:1; pointer-events:auto}
.hint{color:var(--mute); font-size:12.5px}
.btn:disabled{opacity:.4; cursor:default}
.tw{position:relative}
.info{position:absolute; right:8px; bottom:8px; width:28px; height:28px; border-radius:50%; border:1px solid rgba(255,255,255,.18); background:rgba(10,10,14,.78); color:#f2f2f5; font:600 13px var(--f-mono); display:grid; place-items:center; padding:0; opacity:0; transition:opacity .12s}
.card:hover .info,.info:focus-visible,.info[aria-expanded="true"]{opacity:1}
@media (hover:none){.info{opacity:1}}
.card.bare{border-color:transparent; background:transparent}
.card.bare .thumb{border-radius:10px; overflow:hidden}
.card.bare:hover{border-color:transparent}
.card.bare:hover .thumb{outline:2px solid var(--acc); outline-offset:-2px}
.head .tog{margin-left:auto}
.gal{margin-top:36px}
.h2b{font:500 16px var(--f-brand); margin:0; text-transform:none; letter-spacing:0; color:var(--ink)}
.gal .head{margin-bottom:4px}
.same{margin-top:48px; padding-top:24px; border-top:1px solid var(--line)}
.ctx{position:fixed; z-index:45; min-width:180px; background:var(--surf2); border:1px solid var(--line); border-radius:10px; padding:6px; box-shadow:0 16px 40px rgba(0,0,0,.55); display:flex; flex-direction:column}
.ctx[hidden]{display:none}
.ctx button{border:0; background:none; text-align:left; padding:8px 10px; border-radius:6px; font-size:13.5px}
.ctx button:hover,.ctx button:focus-visible{background:var(--line); outline:none}
.ctx .danger{color:var(--bad)}
.ctx-t{font-size:11.5px; color:var(--faint); padding:4px 10px 6px; max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ctx-sep{height:1px; background:var(--line); margin:4px 0}
.bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.sec{display:flex; flex-direction:column; gap:10px}
.sec h2{font:500 11px var(--f-ui); text-transform:uppercase; letter-spacing:.09em; color:var(--faint); margin:0}
.strip{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px}
.el{flex:none; display:flex; flex-direction:column; gap:6px; width:132px; padding:8px; border-radius:10px; border:1px solid var(--line); background:var(--surf); text-align:left}
.el:hover{border-color:var(--tc)}
.el .im{height:72px; border-radius:6px; background:var(--surf2); display:grid; place-items:center; overflow:hidden; border-top:3px solid var(--tc)}
.el .im img{max-width:100%; max-height:100%; object-fit:contain}
.el .l{display:flex; align-items:center; gap:6px; font-size:12.5px}
.panel{background:var(--surf); border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:20px; min-width:0}
.tags{display:flex; flex-wrap:wrap; gap:6px}
.tag{display:inline-flex; align-items:center; background:var(--surf2); border:1px solid var(--line); border-radius:999px; font-size:12.5px}
.tag button{border:0; background:none; padding:4px 4px 4px 10px; border-radius:999px 0 0 999px}
.tag button:hover{color:var(--acc)}
.tag button.x{padding:4px 9px 4px 4px; border-radius:0 999px 999px 0; color:var(--mute)}
.tag button.x:hover{color:var(--bad)}
.tagform{display:flex; gap:6px}
.tagform input{flex:1; min-width:0; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--bg); padding:0 10px}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:13px}
.kv dt{color:var(--mute)} .kv dd{margin:0; font-family:var(--f-mono); font-size:12.5px; overflow-wrap:anywhere}
.flist{display:flex; flex-direction:column; gap:2px}
.flist .nav{padding:6px 8px; font-size:13px}
.note{font-size:12.5px; color:var(--mute); background:var(--surf2); border-radius:8px; padding:8px 10px}
.note.warn{color:var(--warn)}
.crop{border-radius:12px; border:1px solid var(--line); border-top:4px solid var(--tc); padding:28px; display:grid; place-items:center; min-height:200px;
  background-color:var(--surf); background-image:linear-gradient(45deg,var(--surf2) 25%,transparent 25%,transparent 75%,var(--surf2) 75%),linear-gradient(45deg,var(--surf2) 25%,transparent 25%,transparent 75%,var(--surf2) 75%); background-size:20px 20px; background-position:0 0,10px 10px}
.crop img{max-width:100%; max-height:300px; box-shadow:0 10px 40px rgba(0,0,0,.45)}
.typeline{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.typeline .tname{font:500 18px var(--f-brand)}
.typeline .conf{font:400 12.5px var(--f-mono); color:var(--mute)}
.parent{position:relative; display:block; width:100%; padding:0; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#000; line-height:0}
.parent img{width:100%; display:block; opacity:.85}
.parent:hover img{opacity:1}
.parent .ol{position:absolute; border:2px solid var(--tc); box-shadow:0 0 0 9999px rgba(0,0,0,.4); border-radius:2px}
select{height:34px; border-radius:8px; border:1px solid var(--line); background:var(--surf2); padding:0 10px; width:100%}

/* Overlays */
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px)); background:var(--surf2); border:1px solid var(--line); border-radius:10px; padding:10px 12px 10px 16px; display:flex; align-items:center; gap:14px; box-shadow:0 12px 40px rgba(0,0,0,.5); z-index:30; max-width:calc(100% - 32px)}
.modal{position:fixed; inset:0; background:var(--scrim); display:grid; place-items:center; z-index:40; padding:16px}
.dlg{background:var(--surf); border:1px solid var(--line); border-radius:14px; padding:20px; width:min(400px,100%); display:flex; flex-direction:column; gap:14px}
.dlg h3{margin:0; font:500 16px var(--f-brand)}
.dlg p{margin:0; color:var(--mute)}
.dlg .bar{justify-content:flex-end}
.drop{position:fixed; inset:12px; border:2px dashed var(--acc); border-radius:16px; background:color-mix(in srgb, var(--bg) 85%, transparent); display:grid; place-items:center; z-index:50; font:500 18px var(--f-brand); pointer-events:none}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

@media (max-width:860px){
  .app{grid-template-columns:1fr; height:auto; min-height:100%}
  .side{flex-direction:row; align-items:center; gap:8px; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line); padding-block:10px; padding-right:max(16px, env(safe-area-inset-right,0px)); padding-left:max(16px, env(safe-area-inset-left,0px))}
  .group{flex-direction:row; gap:6px}
  .glabel,.keys{display:none}
  .brand{padding:0 6px 0 0}
  .nav{width:auto; background:var(--surf); border:1px solid var(--line); border-radius:999px; padding:6px 12px}
  .nav[aria-current="true"]{box-shadow:none; border-color:var(--acc)}
  .main{overflow:visible}
  .top{padding-left:max(16px, env(safe-area-inset-left,0px))}
  .search{order:5; width:100%}
  .view{overflow:visible; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
  .detail{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side" aria-label="Library"></nav>
  <div class="main">
    <header class="top">
      <button class="ib" id="back" data-act="back" aria-label="Back" title="Back (Esc)">←</button>
      <button class="ib" id="fwd" data-act="fwd" aria-label="Forward" title="Forward">→</button>
      <div class="crumbs" id="crumbs"></div>
      <input class="search" id="q" type="search" placeholder="Search name, tag or site" aria-label="Search">
      <button class="ib" id="theme" data-act="theme" aria-label="Switch to light theme" title="Switch to light theme">☀</button>
      <button class="pill" id="capture" data-act="capture" aria-pressed="true" title="Intercept saves from inspiration sites"><span class="led"></span><span id="capLbl">Capture on</span></button>
      <button class="btn" data-act="simulate" title="Pretend you saved an image on Dribbble, Pinterest or Awwwards">Simulate save</button>
      <label class="btn primary" for="file">Import images</label>
      <input class="sr" id="file" type="file" accept="image/*" multiple>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<div class="ctx" id="ctx" hidden role="menu"></div>
<div class="modal" id="modal" hidden></div>
<div class="drop" id="drop" hidden>Drop images to save them</div>
<script src="app.js"></script>
</body>
</html>
